name: OzonStyle
options:
  bundleIdPrefix: com.baha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
targets:
  OzonStyle:
    type: application
    platform: iOS
    sources:
      - OzonStyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baha.OzonStyle
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: brandPrimary
  OzonStyleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OzonStyleUITests
    dependencies:
      - target: OzonStyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baha.OzonStyleUITests
        TEST_TARGET_NAME: OzonStyle
schemes:
  OzonStyle:
    build:
      targets:
        OzonStyle: all
    test:
      targets:
        - OzonStyleUITests
    run:
      config: Debug
